[package]
name = "k0maru-harness"
version = "0.1.0"
edition = "2021"
description = "Next-Generation Daemonless Meta-Harness & Orchestrator for Decoupled Unix-Philosophy Agent Pillars"
authors = ["k0maru3"]
license = "MIT OR Apache-2.0"

[lib]
name = "k0maru_harness"
path = "src/lib.rs"

[[bin]]
name = "k0maru-harness"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
dirs = "7.0.0"
colored = "3.0"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
